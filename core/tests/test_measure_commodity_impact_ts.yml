test_impact_constant_monthly_with_year:
  model: openbca_core.measure_commodity_impact_ts
  inputs:
    openbca_core.all_avoided_costs_ts:
      rows:
        - avoided_cost_subset: constant/monthly_with_year
          commodity: electricity
          avoided_cost: ac1
          av_cost_dollar_per_energy_unit: 0.1
    openbca_core.measure_commodity_load_shape_ts:
      rows:
        - avoided_cost_subset: constant/monthly_with_year
          commodity: electricity
          measure_id: m1
          year: 2022
          month: 7
          quarter: 3
          net_energy_savings_ts: 10
          discount_factor: 1
    measure.measure_commodity_avoided_costs:
      rows:
        - measure_id: m1
          avoided_cost: ac1
  outputs:
    query:
      rows:
        - measure_id: m1
          commodity: electricity
          avoided_cost: ac1
          avoided_cost_subset: constant/monthly_with_year
          year: 2022
          quarter: 3
          month: 7
          discount_factor: 1
          net_energy_savings_ts: 10
          av_cost_dollar_per_energy_unit: 0.1
          impact_value: 1.0

