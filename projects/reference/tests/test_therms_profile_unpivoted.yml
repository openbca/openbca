test_therms_profile_unpivoted:
  model: california.therms_profile_unpivoted
  inputs:
    california.therms_profile:
        rows:
        - utility: PG&E
          quarter: Q1
          month: 1
          summer: 10.5
          annual: 20.0
          winter: 30.25
  outputs:
    query:
      rows:
        - utility: PG&E
          quarter: Q1
          month: 1
          therms_profile: summer
          value: 10.5
        - utility: PG&E
          quarter: Q1
          month: 1
          therms_profile: annual
          value: 20.0
        - utility: PG&E
          quarter: Q1
          month: 1
          therms_profile: winter
          value: 30.25
